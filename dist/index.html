<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>OpenClaw Office</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #58a838;
    }
    body { display: block; }
    canvas {
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    #connection-status {
      position: fixed;
      top: 8px; right: 8px;
      font-family: 'SF Mono', Monaco, monospace;
      font-size: 10px;
      color: #0f0;
      background: rgba(0,0,0,0.6);
      padding: 4px 8px;
      border-radius: 4px;
      z-index: 100;
      transition: opacity 1s;
      pointer-events: none;
    }
    #config-overlay {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.9);
      color: #0f0;
      font-family: 'SF Mono', Monaco, monospace;
      padding: 24px;
      border-radius: 12px;
      z-index: 200;
      display: none;
      flex-direction: column;
      gap: 12px;
      min-width: 360px;
    }
    #config-overlay h2 { font-size: 14px; margin-bottom: 8px; }
    #config-overlay label { font-size: 11px; color: #0a0; }
    #config-overlay input {
      background: #111;
      border: 1px solid #030;
      color: #0f0;
      padding: 8px;
      font-family: monospace;
      font-size: 12px;
      border-radius: 4px;
      width: 100%;
    }
    #config-overlay button {
      background: #0f0;
      color: #000;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-family: monospace;
      font-size: 12px;
      font-weight: bold;
    }
    #config-overlay button:hover { background: #0c0; }
  </style>

  <script>
    // Show config overlay if no gateway URL is configured
    (function() {
      const url = localStorage.getItem('oc_gateway_url');
      const token = localStorage.getItem('oc_gateway_token');
      const params = new URLSearchParams(window.location.search);
      if (!url && !params.get('gw')) {
        const overlay = document.getElementById('config-overlay');
        if (overlay) overlay.style.display = 'flex';
      }
      document.getElementById('cfg-save')?.addEventListener('click', () => {
        const u = document.getElementById('cfg-url').value || 'ws://127.0.0.1:18789';
        const t = document.getElementById('cfg-token').value || '';
        localStorage.setItem('oc_gateway_url', u);
        localStorage.setItem('oc_gateway_token', t);
        window.location.search = '';
      });
    })();
  </script>
</body>
</html>
