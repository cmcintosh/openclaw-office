<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>OpenClaw Office</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #1a1a2a;
      font-family: 'SF Mono', Monaco, 'Courier New', monospace;
      color: #e0e0e0;
    }
    body { display: block; }
    canvas {
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    #app { width: 100%; height: 100%; }

    /* Login Screen */
    .login-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #1a1a2a 0%, #16213e 50%, #0f3460 100%);
    }
    .login-card {
      background: rgba(0,0,0,0.6);
      border: 1px solid #333;
      border-radius: 16px;
      padding: 32px;
      min-width: 320px;
      max-width: 400px;
      text-align: center;
    }
    .login-logo { font-size: 48px; margin-bottom: 8px; }
    .login-card h1 { color: #0f0; font-size: 20px; margin-bottom: 4px; }
    .login-subtitle { color: #888; font-size: 12px; margin-bottom: 24px; }
    .login-field { margin-bottom: 16px; text-align: left; }
    .login-field label { display: block; font-size: 11px; color: #0a0; margin-bottom: 4px; }
    .login-field input {
      width: 100%;
      padding: 10px;
      background: #111;
      border: 1px solid #033;
      color: #0f0;
      font-family: monospace;
      font-size: 14px;
      border-radius: 6px;
    }
    .login-field input:focus { outline: none; border-color: #0f0; box-shadow: 0 0 0 2px rgba(0,255,0,0.2); }
    #login-submit {
      width: 100%;
      padding: 12px;
      background: #0f0;
      color: #000;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-family: monospace;
      font-size: 14px;
      font-weight: bold;
      transition: background 0.2s;
    }
    #login-submit:hover { background: #0c0; }
    #login-submit:disabled { opacity: 0.5; cursor: not-allowed; }
    .login-error { color: #f44; font-size: 12px; margin-top: 12px; min-height: 16px; }
    .login-hint { color: #555; font-size: 10px; margin-top: 16px; }

    /* City View */
    .city-view-wrap {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #2a2a3a;
    }
    #city-canvas {
      max-width: 100%;
      max-height: 100%;
      border: 2px solid #333;
      box-shadow: 0 0 40px rgba(0,0,0,0.5);
    }

    /* Office View */
    .office-view {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
    }
    .office-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 16px;
      background: rgba(0,0,0,0.8);
      border-bottom: 1px solid #333;
      flex-shrink: 0;
    }
    .office-back-btn {
      background: #333;
      color: #0f0;
      border: 1px solid #444;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-family: monospace;
      font-size: 12px;
    }
    .office-back-btn:hover { background: #444; }
    .office-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      color: #e0e0e0;
    }
    .office-dept-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: inline-block;
    }
    .office-dept-desc { color: #888; font-size: 11px; }
    .office-agent-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #888;
    }
    .agent-status { font-size: 14px; }
    .office-body {
      display: flex;
      flex: 1;
      overflow: hidden;
    }
    .office-canvas-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #2a2a3a;
      min-width: 0;
    }
    #office-canvas {
      max-width: 100%;
      max-height: 100%;
      image-rendering: pixelated;
    }

    /* Chat Panel */
    .chat-panel {
      width: 380px;
      min-width: 320px;
      display: flex;
      flex-direction: column;
      background: rgba(20,20,30,0.95);
      border-left: 1px solid #333;
    }
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .chat-messages::-webkit-scrollbar { width: 6px; }
    .chat-messages::-webkit-scrollbar-track { background: #111; }
    .chat-messages::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
    .chat-msg {
      padding: 8px 12px;
      border-radius: 8px;
      max-width: 90%;
      word-wrap: break-word;
      font-size: 13px;
      line-height: 1.4;
    }
    .chat-msg-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
      font-size: 10px;
      opacity: 0.7;
    }
    .msg-user {
      background: #1a3a1a;
      align-self: flex-end;
      border: 1px solid #2a5a2a;
    }
    .msg-agent {
      background: #1a1a3a;
      align-self: flex-start;
      border: 1px solid #2a2a5a;
    }
    .msg-system {
      background: #3a3a1a;
      align-self: center;
      border: 1px solid #5a5a2a;
      font-size: 11px;
      opacity: 0.8;
      text-align: center;
    }
    .chat-input-row {
      display: flex;
      gap: 8px;
      padding: 12px;
      border-top: 1px solid #333;
      background: rgba(0,0,0,0.5);
    }
    #chat-input {
      flex: 1;
      padding: 8px 12px;
      background: #111;
      border: 1px solid #333;
      color: #e0e0e0;
      border-radius: 6px;
      font-family: monospace;
      font-size: 13px;
    }
    #chat-input:focus { outline: none; border-color: #0f0; }
    .voice-btn {
      background: #1a1a2a;
      border: 1px solid #333;
      color: #e0e0e0;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      transition: all 0.2s;
    }
    .voice-btn:hover { background: #2a2a3a; border-color: #444; }
    .voice-btn.recording {
      background: #3a1a1a;
      border-color: #f44;
      animation: pulse 1s infinite;
    }
    .voice-btn.tts-active {
      background: #1a3a2a;
      border-color: #4ade80;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }
    .chat-send-btn {
      background: #0f0;
      color: #000;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-family: monospace;
      font-size: 13px;
      font-weight: bold;
    }
    .chat-send-btn:hover { background: #0c0; }
    .voice-status {
      padding: 4px 12px;
      font-size: 11px;
      color: #888;
      min-height: 20px;
    }

    /* Settings View */
    .settings-view {
      width: 100%;
      height: 100%;
      overflow-y: auto;
      background: #1a1a2a;
      padding: 24px;
    }
    .settings-header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
    }
    .settings-back-btn {
      background: #333;
      color: #0f0;
      border: 1px solid #444;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-family: monospace;
    }
    .settings-header h1 { color: #0f0; font-size: 18px; }
    .settings-body {
      max-width: 600px;
      margin: 0 auto;
    }
    .settings-section {
      background: rgba(0,0,0,0.4);
      border: 1px solid #333;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 16px;
    }
    .settings-section h2 {
      color: #0f0;
      font-size: 14px;
      margin-bottom: 16px;
      border-bottom: 1px solid #333;
      padding-bottom: 8px;
    }
    .dept-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 16px;
    }
    .dept-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 12px;
      background: rgba(255,255,255,0.05);
      border-radius: 6px;
    }
    .dept-item-color {
      width: 16px;
      height: 16px;
      border-radius: 4px;
      flex-shrink: 0;
    }
    .dept-item-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .dept-item-agent { font-size: 11px; color: #888; }
    .dept-item-desc { font-size: 11px; color: #666; }
    .dept-delete-btn {
      background: #3a1a1a;
      color: #f44;
      border: 1px solid #5a2a2a;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 11px;
    }
    .dept-delete-btn:hover { background: #5a2a2a; }
    .dept-add-form, .config-form, .gateway-info {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .dept-add-form { gap: 6px; }
    .dept-add-form input, .config-form input, .gateway-info input {
      padding: 8px 10px;
      background: #111;
      border: 1px solid #333;
      color: #e0e0e0;
      border-radius: 4px;
      font-family: monospace;
      font-size: 12px;
    }
    .dept-add-form input:focus, .config-form input:focus, .gateway-info input:focus {
      outline: none;
      border-color: #0f0;
    }
    .dept-add-form button, .config-form button, .gateway-info button {
      padding: 8px 16px;
      background: #0a3a0a;
      color: #0f0;
      border: 1px solid #1a5a1a;
      border-radius: 4px;
      cursor: pointer;
      font-family: monospace;
      font-size: 12px;
      align-self: flex-start;
    }
    .dept-add-form button:hover, .config-form button:hover, .gateway-info button:hover {
      background: #1a5a1a;
    }
    .config-status { font-size: 12px; margin-top: 8px; }
    .empty-state { color: #666; font-size: 12px; text-align: center; padding: 16px; }
    .gateway-info label { font-size: 11px; color: #888; }
  </style>

</head>

</body>
</html>
